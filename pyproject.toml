[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qrd"
version = "0.0.1"
description = "quant-rank-dashboard: daily Top 50 multi-asset ranking with rigorous backtests (research only, not investment advice)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "duckdb>=1.0,<2",
    "requests>=2.31,<3",
    "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
]

[project.scripts]
qrd = "qrd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit external services (skipped unless QRD_RUN_NETWORK=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
