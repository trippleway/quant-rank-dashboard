<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="quant-rank-dashboard：多資產每日 Top 50 排名與回測（僅供研究與學習，不構成投資建議）" />
    <link rel="icon" href="data:," />
    <title>quant-rank-dashboard</title>
    <script>
      // Apply the saved / OS theme before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("qrd-theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
